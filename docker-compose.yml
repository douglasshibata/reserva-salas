version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: reserva-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: reserva-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4317
    depends_on:
      redis:
        condition: service_healthy

  sugestao-service:
    build:
      context: ./sugestao-service
      dockerfile: Dockerfile
    container_name: sugestao-service
    ports:
      - "8082:8082"
    environment:
      - QUARKUS_REST_CLIENT_BOOKING_SERVICE_API_URL=http://booking-service:8081
    depends_on:
      - booking-service
